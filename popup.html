<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: sans-serif;
      width: 220px;
      padding: 16px;
      background: #1e1e2e;
      color: #cdd6f4;
    }
    h2 { margin: 0 0 14px 0; font-size: 15px; color: #cba6f7; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .toggle-label { font-size: 12px; color: #a6adc8; }

    .switch { position: relative; width: 42px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #45475a;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider:before {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #a6e3a1; }
    input:checked + .slider:before { transform: translateX(18px); }

    .hint { font-size: 10px; color: #a6adc8; margin-bottom: 14px; }

    .keep-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    input[type=number] {
      width: 52px;
      padding: 5px;
      background: #313244;
      color: #cdd6f4;
      border: 1px solid #45475a;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 9px;
      background: #cba6f7;
      color: #1e1e2e;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #b389f5; }
    #status { font-size: 11px; color: #a6e3a1; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>📚 Bookmark Backup</h2>

  <div class="toggle-row">
    <span class="toggle-label">Auto-backup on changes</span>
    <label class="switch">
      <input type="checkbox" id="autoToggle">
      <span class="slider"></span>
    </label>
  </div>
  <p class="hint">Backs up automatically a few seconds after you add, remove or edit a bookmark.</p>

  <div class="keep-row">
    <span class="toggle-label">Backups to keep</span>
    <input type="number" id="keepCount" min="1" max="50" value="5">
  </div>

  <button id="backupBtn">Backup Now</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
